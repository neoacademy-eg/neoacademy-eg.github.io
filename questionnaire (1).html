<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Agency | Kick-Off Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EDE1;--ink:#1E1E1E;--mut:#5B6670;--ac:#C0392B;--navy:#2E4A5C;--mus:#E8B94A;--line:#D8CDB9;--card:#FBF7EF;--err:#9B1C1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 80px}
.brand{font:400 26px/1 'Archivo Black',Cairo,sans-serif;color:var(--ac);margin-bottom:28px}.brand::after{content:'';display:block;width:36px;height:4px;background:var(--mus);margin-top:10px}
.bar{display:flex;gap:6px;margin-bottom:32px}
.bar span{flex:1;height:4px;background:var(--line);border-radius:2px}
.bar span.on{background:var(--ac)}
h1{font:400 30px/1.25 'Archivo Black',Cairo,sans-serif;margin:0 0 4px}
.sub{margin:0 0 32px;color:var(--mut);direction:rtl;text-align:right;font-size:18px}
.q{margin-bottom:28px}
.q .en{font-weight:600;display:block}
.q .ar{display:block;direction:rtl;text-align:right;color:var(--mut);margin-bottom:8px}
.req::after{content:" *";color:var(--ac)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 13px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,.opt:focus-visible,button:focus-visible{outline:3px solid var(--navy);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;text-align:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;line-height:1.35}
.opt small{display:block;direction:rtl;color:var(--mut);font-size:14px}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on small{color:#dbe4ea}
.bad .opt,.bad input,.bad textarea{border-color:var(--err)}
.err{color:var(--err);font-weight:600;min-height:52px}
.err span{display:block;direction:rtl;text-align:right}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.btn{font:600 16px Cairo,sans-serif;border:0;border-radius:8px;padding:12px 26px;cursor:pointer;background:var(--ac);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.pick{display:grid;gap:14px;margin-top:8px}
.pick .btn{text-align:left;padding:20px 22px;font-size:19px}
.pick .btn small{display:block;direction:rtl;text-align:right;font-weight:400;font-size:16px;color:#fff;opacity:.85;margin-top:2px}
@media(max-width:480px){h1{font-size:25px}}
</style>
</head>
<body>
<main>
<div class="brand">Neo Agency</div>
<div id="app"></div>
</main>
<script>
/* 1) https://script.google.com/macros/s/AKfycbwDlPU79h8Ainx0HhlFYV6Jrx5wjCJpZj7WRbHaOOuOWmDZW5_6rrR7EuDxw2gs3gJHZw/exec */
const SCRIPT_URL='PASTE_WEB_APP_URL_HERE';

const Q=(id,t,en,ar,o,r,s)=>({id,t,en,ar,o:o?o.split(';').map(x=>x.split('|')):0,r,s});
const SOCIAL=['Instagram|إنستجرام','Facebook|فيسبوك','TikTok|تيك توك','LinkedIn|لينكدإن','YouTube|يوتيوب'].join(';');
const NAME=[Q('nm','t','Your name','اسمك',0,1),Q('wa','t','WhatsApp number','رقم الواتساب',0,1),Q('em','t','Email','البريد الإلكتروني')];

const FORMS={
branding:{en:'Brand identity questionnaire',ar:'استبيان الهوية البصرية',S:[
['Basic information','المعلومات الأساسية',[
Q('brand','t','Write your brand name exactly as you want it to appear in the design','اكتب اسم العلامة التجارية بالشكل الذي تريده أن يظهر في التصميم',0,1),
Q('story','p','Does the name have a story or meaning?','هل لهذا الاسم قصة أو معنى خاص؟'),
Q('tag','t','Do you have a tagline or slogan?','هل لديك عبارة أو شعار نصي؟'),
Q('kind','r','Do you offer services or products?','هل تقدمون خدمات أم منتجات؟','Services|خدمات;Products|منتجات;Both|الاثنان معاً',1),
Q('what','p','What do you provide?','ما الخدمة أو المنتج الذي تقدمه؟',0,1)]],
['Business and audience','النشاط والجمهور',[
Q('desc','p','Describe your business in a few sentences','اشرح نشاطك في بضع جمل',0,1),
Q('aud','p','Who is your ideal customer? (age, interests, location)','من هو عميلك المثالي؟ (العمر، الاهتمامات، المكان)',0,1),
Q('comp','p','Who are your main competitors?','من هم أهم منافسيك؟'),
Q('diff','p','What makes you different from them?','ما الذي يميزك عنهم؟')]],
['Brand personality','شخصية العلامة',[
Q('pers','m','Pick up to five words that describe your brand','اختر حتى خمس كلمات تصف علامتك','Luxury|فخامة;Friendly|ودود;Bold|جريء;Minimal|بسيط;Playful|مرح;Professional|احترافي;Traditional|تقليدي;Modern|عصري;Youthful|شبابي;Trustworthy|موثوق',1),
Q('tone','r','How should the brand speak?','كيف تتحدث العلامة مع جمهورها؟','Formal|رسمي;Friendly|ودي;Mixed|مزيج حسب الموقف'),
Q('feel','p','How should customers feel after dealing with you?','بماذا تريد أن يشعر العميل بعد التعامل معك؟'),
Q('val','p','What are your core values?','ما القيم الأساسية لعلامتك؟')]],
['Visual direction','الاتجاه البصري',[
Q('col','p','Colors you like, and colors you want to avoid','الألوان التي تفضلها والتي تريد تجنبها'),
Q('ref','p','Links to brands or designs you like, and what you like about them','روابط لعلامات أو تصاميم تعجبك، وما الذي يعجبك فيها'),
Q('lang','r','Logo language','لغة الشعار','Arabic|عربي;English|إنجليزي;Both|الاثنان'),
Q('old','r','Do you have an existing logo?','هل لديك شعار حالي؟','No, from scratch|لا، من الصفر;Yes, redesign it|نعم، أريد تطويره;Yes, keep it|نعم، أريد الإبقاء عليه')]],
['Delivery and contact','التسليم والتواصل',[
Q('need','m','What do you need?','ماذا تحتاج؟','Logo|شعار;Brand guidelines|دليل الهوية;Stationery|مطبوعات إدارية;Packaging|تغليف;Social media kit|هوية السوشيال ميديا'),
Q('dl','t','Preferred delivery date','الموعد المفضل للتسليم'),
Q('bud','t','Budget range','الميزانية التقريبية')].concat(NAME)]]},

general:{en:'General project questionnaire',ar:'استبيان المشروع العام',S:[
['About you','نبذة عنك',[
Q('brand','t','Brand or company name','اسم العلامة أو الشركة',0,1),
Q('desc','p','What does your business do?','ما هو نشاطك؟',0,1)].concat(NAME)],
['What you need','ما الذي تحتاجه',[
Q('svc','m','Which services do you need?','ما الخدمات التي تحتاجها؟','Brand identity|هوية بصرية;Social media designs|تصاميم سوشيال ميديا;Social media management|إدارة السوشيال ميديا;Packaging|تغليف;Print and ads|مطبوعات وإعلانات;Website or app design|تصميم موقع أو تطبيق;Motion and video|موشن وفيديو;Other|أخرى',1)]],
['Goals and audience','الهدف والجمهور',[
Q('goal','p','What is the main goal of this project?','ما الهدف الأساسي من المشروع؟',0,1),
Q('aud','p','Who are you trying to reach?','من الجمهور الذي تريد الوصول إليه؟')]],
['Project details','تفاصيل المشروع',[
Q('bg','r','Do you have brand guidelines?','هل لديك دليل هوية؟','Yes|نعم;Partly|جزئياً;No|لا',0,['svc','Brand']),
Q('plat','m','Which platforms?','ما المنصات المطلوبة؟',SOCIAL,0,['svc','Social media']),
Q('vol','t','How many posts per month?','كم عدد المنشورات شهرياً؟',0,0,['svc','Social media']),
Q('pt','p','What do you need to print or advertise, and in what sizes?','ما الذي تريد طباعته أو الإعلان عنه، وبأي مقاسات؟',0,0,['svc','Print']),
Q('pk','p','Which products need packaging, and in what quantities?','ما المنتجات التي تحتاج تغليفاً، وبأي كميات؟',0,0,['svc','Packaging']),
Q('wb','p','Which pages or features do you need?','ما الصفحات أو المميزات المطلوبة؟',0,0,['svc','Website']),
Q('mo','p','Which videos or animations, and how long?','ما الفيديوهات أو الأنيميشن المطلوبة، وبأي مدة؟',0,0,['svc','Motion']),
Q('oth','p','Tell us what you need','أخبرنا بما تحتاجه',0,0,['svc','Other'])]],
['References and timing','المراجع والموعد',[
Q('ref','p','Links to work you like','روابط لأعمال تعجبك'),
Q('dl','t','Preferred delivery date','الموعد المفضل للتسليم'),
Q('bud','t','Budget range','الميزانية التقريبية'),
Q('more','p','Anything else we should know?','هل هناك أي شيء آخر نحتاج معرفته؟')]]]}};

let F,K,si=0,A={};
const app=document.getElementById('app');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const vis=q=>!q.s||(A[q.s[0]]||[]).some(v=>v.startsWith(q.s[1]));
const secs=()=>F.S.map(s=>({en:s[0],ar:s[1],q:s[2].filter(vis)})).filter(s=>s.q.length);
const bi=(en,ar)=>{const f=document.createDocumentFragment();f.append(el('span',0,en),el('span',0,ar));return f};

function pick(){
  app.replaceChildren();
  app.append(el('h1',0,'Let\u2019s get to know your project'),el('p','sub','دعنا نتعرف على مشروعك'));
  const w=el('div','pick');
  for(const k in FORMS){const b=el('button','btn',FORMS[k].en);b.append(el('small',0,FORMS[k].ar));b.onclick=()=>start(k);w.append(b)}
  app.append(w);
}
function start(k){K=k;F=FORMS[k];A={};si=0;draw()}

function field(q){
  const d=el('div','q');d.dataset.id=q.id;
  const en=el('span','en'+(q.r?' req':''),q.en);
  d.append(en,el('span','ar',q.ar));
  if(q.t==='t'||q.t==='p'){
    const i=el(q.t==='t'?'input':'textarea');i.dir='auto';i.value=A[q.id]||'';
    i.oninput=()=>{A[q.id]=i.value;d.classList.remove('bad')};d.append(i);
  }else{
    const w=el('div','opts'),multi=q.t==='m';
    q.o.forEach(([e,a])=>{
      const b=el('button','opt',e);b.type='button';b.append(el('small',0,a));
      const cur=()=>multi?(A[q.id]||[]):[A[q.id]];
      if(cur().includes(e))b.classList.add('on');
      b.onclick=()=>{
        d.classList.remove('bad');
        if(multi){let v=A[q.id]||[];
          if(v.includes(e))v=v.filter(x=>x!==e);else if(q.id!=='pers'||v.length<5)v=v.concat(e);
          A[q.id]=v;
        }else A[q.id]=e;
        w.querySelectorAll('.opt').forEach((x,i)=>x.classList.toggle('on',cur().includes(q.o[i][0])));
      };
      w.append(b);
    });
    d.append(w);
  }
  return d;
}

function draw(){
  const S=secs();si=Math.min(si,S.length-1);const s=S[si];
  app.replaceChildren();
  const bar=el('div','bar');S.forEach((_,i)=>bar.append(el('span',i<=si?'on':'')));
  app.append(bar,el('h1',0,s.en),el('p','sub',s.ar));
  s.q.forEach(q=>app.append(field(q)));
  const err=el('div','err');err.setAttribute('role','alert');
  const nav=el('div','nav');
  const back=el('button','btn ghost');back.append(bi('Back','رجوع'));
  back.style.visibility=si?'visible':'hidden';
  back.onclick=()=>{si--;draw();scrollTo(0,0)};
  const last=si===S.length-1;
  const next=el('button','btn');next.append(last?bi('Send','إرسال'):bi('Next','التالي'));
  next.onclick=()=>{
    let bad=0;
    s.q.forEach(q=>{const v=A[q.id];const miss=q.r&&(!v||!v.length||(typeof v==='string'&&!v.trim()));
      app.querySelector('[data-id="'+q.id+'"]').classList.toggle('bad',!!miss);bad+=miss?1:0});
    if(bad){err.replaceChildren(el('span',0,'Please answer the required questions.'),el('span',0,'من فضلك أجب عن الأسئلة المطلوبة.'));
      app.querySelector('.bad').scrollIntoView({block:'center'});return}
    if(last)send(next,err);else{si++;draw();scrollTo(0,0)}
  };
  nav.append(back,next);app.append(err,nav);
}

async function send(btn,err){
  const answers={};
  secs().forEach(s=>s.q.forEach(q=>{const v=A[q.id];if(v&&v.length)answers[q.en]=Array.isArray(v)?v.join(' | '):v.trim()}));
  btn.disabled=true;
  try{
    if(SCRIPT_URL.startsWith('PASTE'))throw new Error('no url');
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:K,answers})});
    app.replaceChildren(el('h1',0,'Thank you. We received your answers.'),el('p','sub','شكراً لك. تم استلام إجاباتك وسنتواصل معك قريباً.'));
  }catch(e){
    btn.disabled=false;
    err.replaceChildren(el('span',0,'Could not send. Check your connection and try again.'),el('span',0,'تعذر الإرسال. تأكد من الاتصال وحاول مرة أخرى.'));
  }
}

const t=new URLSearchParams(location.search).get('type');
if(FORMS[t])start(t);else pick();
</script>
</body>
</html>
